<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Glowing Sun Rays (Philippines Sun motif) -->
  <g transform="translate(256, 210)" filter="url(#glow)">
    <!-- Sun Center -->
    <circle r="44" fill="url(#goldGrad)"/>
    <!-- 8 Sun Rays (LET & 8 provinces motif) -->
    <g stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round">
      <line x1="0" y1="-56" x2="0" y2="-76"/>
      <line x1="40" y1="-40" x2="54" y2="-54"/>
      <line x1="56" y1="0" x2="76" y2="0"/>
      <line x1="40" y1="40" x2="54" y2="54"/>
      <line x1="0" y1="56" x2="0" y2="76"/>
      <line x1="-40" y1="40" x2="-54" y2="54"/>
      <line x1="-56" y1="0" x2="-76" y2="0"/>
      <line x1="-40" y1="-40" x2="-54" y2="-54"/>
    </g>
  </g>

  <!-- Open Book / Torch Motif -->
  <path d="M140 330 C200 310, 240 325, 256 345 C272 325, 312 310, 372 330 L372 400 C312 380, 272 395, 256 415 C240 395, 200 380, 140 400 Z" 
        fill="#27272a" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round"/>
  
  <line x1="256" y1="345" x2="256" y2="415" stroke="url(#goldGrad)" stroke-width="6"/>

  <!-- LET Badge Text -->
  <text x="256" y="458" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#facc15" text-anchor="middle" letter-spacing="6">LET REVIEW</text>
  <text x="256" y="482" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="3">FUTURE LPT - PHILIPPINES</text>
</svg>
