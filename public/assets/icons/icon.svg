<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient (Deep dark UI) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Amber Gold Gradient matching the graduation cap logo theme -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Subtle Amber Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="500" height="500" x="6" y="6" rx="110" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Inner Soft Accent Accent Rounded Tile -->
  <rect width="440" height="440" x="36" y="36" rx="84" fill="#18181b" fill-opacity="0.6"/>

  <!-- Centered Word-Only Typography: T-LETs! -->
  <g id="wordmark" filter="url(#softGlow)">
    <text
      x="256"
      y="285"
      text-anchor="middle"
      dominant-baseline="central"
      fill="url(#goldGrad)"
      font-family="'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
      font-weight="900"
      font-size="94"
      letter-spacing="-1.5"
    >
      T-LETs!
    </text>
  </g>
</svg>
